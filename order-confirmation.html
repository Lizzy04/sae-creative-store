
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | SAE Creative Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
    <div class="header-brand">
        <img src="images/sae-logo.png" alt="SAE Institute Logo" class="sae-logo">

        <div>
            <h1 class="logo">SAE <span>CREATIVE STORE</span></h1>
            <p>Creativity You Can Wear.</p>
        </div>
    </div>
</header>

    <section class="confirmation-section">

        <h2>Thank You for Your Order!</h2>

        <p class="confirmation-message">

<div class="confirmed-order">

    <h3>Order Summary</h3>

    <div id="confirmed-items">
        <!-- Order items will appear here -->
    </div>

    <h3 id="confirmed-total">Total: R0.00</h3>

</div>
<a href="index.html" class="back-to-store">← Back to Store</a>

    </section>
